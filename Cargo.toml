[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0" # x-release-please-version
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/laurigates/shore-recon"
homepage = "https://github.com/laurigates/shore-recon"
publish = false

[workspace.dependencies]
shoreline-core = { path = "crates/core" }
shoreline-frames = { path = "crates/frames" }
shoreline-masks = { path = "crates/masks" }
shoreline-sfm = { path = "crates/sfm" }
shoreline-splat = { path = "crates/splat" }
shoreline-dense = { path = "crates/dense" }
shoreline-video = { path = "crates/video" }
shoreline-post = { path = "crates/post" }
shoreline-export = { path = "crates/export" }
anyhow = "=1.0.104"
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive", "env"] }
meshopt = { version = "=0.7.0", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
indicatif = "=0.18.6"
gltf = { version = "=1.4.1", default-features = false, features = ["utils"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
thiserror = "=2.0.21"
toml = "=1.1.8+spec-1.1.0"
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that dist builds release artifacts with
[profile.dist]
inherits = "release"
lto = "thin"
