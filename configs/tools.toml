# How each external tool runs on this machine (ADR-0003). One table per tool.
# A host-specific file passed with --tools or SHORELINE_TOOLS replaces whole
# tables, so a GPU host can run COLMAP in a container and keep ffmpeg native.
#
#   runtime = "native" | "podman" | "docker" | "apptainer"
#   program = executable (native) or the command inside the image
#   image   = OCI image pinned by digest (name@sha256:...), containers only
#   gpu     = pass the host GPUs through, containers only (default false)
#
# A container tool can run on another host over ssh (ADR-0009). Only in a host
# file, never here:
#
#   [colmap.remote]
#   host = "<ssh destination>"
#   root = "<absolute mirror directory there>"
#   env  = { APPTAINER_CACHEDIR = "<cache directory there>" }

[ffmpeg]
runtime = "native"
program = "ffmpeg"

# OneFormer ADE20K Swin-L, CPU, linux/arm64 (ADR-0006): the image the containers
# workflow pushed from main. Public: pulling needs no login.
[segment]
runtime = "docker"
program = "segment"
image   = "ghcr.io/laurigates/shoreline-segmentation@sha256:ea0bab1bc4b964e0ce4cdc51968f09a2d5a1929be6b3e69fba93449c85385f6d"

# The local tool profile (ADR-0019): every stage but the videos runs on this
# machine without a GPU host. A host file with [colmap], [brush] and [openmvs]
# tables (the CUDA images on a remote host) replaces these.

# COLMAP 4.2.1, the version the CUDA image pins; on the CPU here (`brew install colmap`).
[colmap]
runtime = "native"
program = "colmap"

# Brush 0.3.0 release binary on PATH: Metal on macOS, Vulkan on Linux.
[brush]
runtime = "native"
program = "brush_app"

# OpenMVS v2.4.0 without CUDA, linux/arm64 + linux/amd64 index (containers/openmvs-cpu).
# Public: pulling needs no login.
[openmvs]
runtime = "docker"
program = "env"
image   = "ghcr.io/laurigates/shoreline-openmvs-cpu@sha256:d32ae1085cc808c7b3a900a83a12ee0c146904f92b157d66a3d0da5f6806b9f9"
