# Defaults. Each dataset config in this directory is merged over this file.

[frames]
fps            = 2.0
blur_threshold = 100.0     # variance of Laplacian; lower is blurrier
max_long_edge  = 3200

[masks]
backend   = "container"   # OneFormer image, the segment tool in tools.toml (ADR-0006); "onnx" is #11
classes   = ["water", "sea", "river", "lake", "sky", "person", "boat"]   # ADE20K label names
dilate_px = 8
temporal  = false

[sfm]
backend       = "colmap"
matcher       = "sequential"   # or "exhaustive" for < ~300 images
single_camera = true
max_features  = 16384

[dense]
backend = "openmvs"

[splat]
backend = "brush"
steps   = 30000

[post]
water_plane       = "fit"    # or a fixed height along the camera up axis, e.g. -1.7 (ADR-0012)
waterline_band_px = 24       # kept pixels this close above an ignored region are waterline
min_component     = 0.01     # fraction of total faces
target_faces      = 500000
texture_max_size  = 4096     # model.glb texture, longest edge in px
floater_max_water = 0.5      # cull Gaussians seen against masked water in more of their views

[video]
# One video per scene (splat, mesh) and view. arc: a sweep around the scene; drone: the
# recorded flight, smoothed, played forward then back.
views         = [{ path = "arc", seconds = 16.0 }, { path = "drone", seconds = 20.0 }]
fps           = 30
width         = 1920
height        = 1080
share_max_mib = 30.0     # share copy limit; Telegram bots take 50 MB

[gates]
min_registered_ratio = 0.85
max_reproj_error_px  = 1.0
min_track_length     = 3.0
max_masked_fraction  = 0.7   # warn only
