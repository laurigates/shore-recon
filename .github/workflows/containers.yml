name: containers

# Builds the tool images under containers/ (ADR-0006, ADR-0011). Pull requests
# build only; main pushes to GHCR, and the job summary prints the digest that a
# tools file pins.
on:
  push:
    branches: [main]
    paths:
      - containers/**
      - .github/workflows/containers.yml
  pull_request:
    paths:
      - containers/**
      - .github/workflows/containers.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux/arm64 for local Docker on Apple Silicon; built under QEMU.
          - name: segmentation
            platform: linux/arm64
            cache: max
          # linux/amd64 for the GPU host (Apptainer --nv).
          - name: brush
            platform: linux/amd64
            cache: max
          # The CUDA devel build stage is too large for the Actions cache, so
          # only the final stage's layers are cached.
          - name: openmvs
            platform: linux/amd64
            cache: min
          # Same: torch and its CUDA libraries make the build stage several GB.
          - name: render
            platform: linux/amd64
            cache: min
    env:
      IMAGE: ghcr.io/laurigates/shoreline-${{ matrix.name }}
      # Only main publishes; a dispatch on another branch builds without pushing.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        if: matrix.name == 'openmvs' || matrix.name == 'render'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform == 'linux/arm64'
        with:
          platforms: arm64
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/${{ matrix.name }}
          file: containers/${{ matrix.name }}/Containerfile
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=${{ matrix.cache }}
      - name: Digest
        if: env.PUSH == 'true'
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
