# Custom dist publish job (publish-jobs = ["./publish-homebrew"] in
# dist-workspace.toml), called from release.yml once the release is hosted.
#
# It replaces dist's built-in homebrew job, which checks out the tap with a
# static secrets.HOMEBREW_TAP_TOKEN. Here a short-lived token is minted from the
# laurigates-homebrew-tap GitHub App (Contents R/W, installed on homebrew-tap
# only); its credentials are pushed by gitops to repos flagged homebrew_tap.
name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish-homebrew-formula:
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_PRIVATE_KEY }}
          owner: laurigates
          repositories: homebrew-tap
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true
          repository: laurigates/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
      # dist uploads the generated formula as an artifact of this run
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # Same steps as dist's generated job; the formula name can differ from the
      # app name, so publish under each release's *.rb filename.
      - name: Commit formula files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name="${filename%.rb}"
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push
