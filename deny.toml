# cargo-deny: RustSec advisories, dependency licences and sources. Runs in CI (ci.yml)
# and locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# The workspace crates are `publish = false` and carry no licence field.
private = { ignore = true }
# Every licence in the current tree; a dependency bringing in another fails the check.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies carry no version; allowed because nothing is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
