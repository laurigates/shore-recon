# Python environment of the render image (ADR-0008, ADR-0011). uv.lock pins every package with
# hashes; the Containerfile installs it with `uv sync --frozen`. After changing this file, run
# `uv lock` here; CI fails when the lock is out of date (`uv lock --check`).
#
# torch 2.13.0 on PyPI is the CUDA 13.0 build, which matches the build stage's toolkit (the
# Containerfile asserts it); PyTorch's cu128 index stops at 2.11. The GPU host's driver (580)
# supports CUDA 13.0. A torch bump that changes the CUDA build moves the base image and the
# assertion with it, so Renovate holds torch updates here for approval (renovate.json).
[project]
name = "shoreline-render"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.13.0",
    # The version the M0 spike rendered with. PyPI's gsplat wheel has no compiled extension (it
    # JIT-compiles at first use), so the image builds the sdist for sm_89 against the installed
    # torch: see no-build-isolation-package and dependency-metadata below.
    "gsplat==1.5.3",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "plyfile==1.1.5",
    # Mesh rendering over headless EGL (ADR-0012): moderngl pulls in glcontext.
    "moderngl==5.13.0",
    # gsplat imports packaging at module load without declaring it.
    "packaging==26.3",
    # gsplat's build: setuptools for setup.py, ninja for torch's extension builder.
    "setuptools==84.2.1",
    "ninja==1.13.2",
]

[tool.uv]
package = false
# The image is linux/amd64 only.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# gsplat's wheel has no compiled code, so build its sdist; its setup.py imports torch, so it
# builds in the image's environment, after everything else (see the Containerfile).
no-binary-package = ["gsplat"]
no-build-isolation-package = ["gsplat"]

# gsplat 1.5.3's install_requires, so that locking never runs its setup.py (which needs torch).
# Update together with the gsplat pin.
[[tool.uv.dependency-metadata]]
name = "gsplat"
version = "1.5.3"
requires-dist = ["ninja", "numpy", "jaxtyping", "rich>=12", "torch"]
